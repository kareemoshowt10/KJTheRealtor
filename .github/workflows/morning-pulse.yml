name: Morning Pulse

on:
  schedule:
    - cron: "0 13 * * *" # ~6am Pacific (13:00 UTC covers PDT; PST runs ~7am — DST isn't cron-aware)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify pure pipeline logic (rotation + scoring)
        run: node scripts/morning-pulse/verify.mjs

      - name: Pull sources, rank, and extract today's top insight
        run: node scripts/morning-pulse/generate.mjs

      - name: Commit and push if a new brief was generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/morning-pulse/*.json
          git diff --staged --quiet || git commit -m "chore: morning-pulse brief for $(date -u +%F)"
          git push

      # Step 5-6 (script + visual brief) need an LLM. Point this at a
      # scheduled Claude Code session (or the Claude API directly) once
      # ANTHROPIC_API_KEY is added as a repo secret — see
      # marketing/morning-pulse-system.md "Wiring the writing step".
      # - name: Write script + visual brief with Claude
      #   run: node scripts/morning-pulse/write-with-claude.mjs
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
