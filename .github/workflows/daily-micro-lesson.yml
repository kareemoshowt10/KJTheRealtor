name: Daily Micro-Lesson

on:
  schedule:
    - cron: "0 13 * * *" # ~6:00 AM America/Los_Angeles (PDT); 5:00 AM during PST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script dependencies
        working-directory: scripts/daily-micro-lesson
        run: npm install

      - name: Verify calendar + filtering logic
        run: node scripts/daily-micro-lesson/verify.mjs

      - name: Generate today's micro-lesson brief
        working-directory: scripts/daily-micro-lesson
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate

      - name: Commit and push if a brief was generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/daily-lesson-*.json marketing/daily-briefs/*.md
          git diff --staged --quiet || git commit -m "chore: daily micro-lesson brief"
          git push
