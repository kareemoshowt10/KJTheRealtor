name: Content Engine

on:
  schedule:
    - cron: "0 13 * * *" # ~6:00 AM Pacific (13:00 UTC covers PDT; add an hour in winter PST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script dependencies
        working-directory: scripts/content-engine
        run: npm install

      - name: Verify pipeline logic
        run: node scripts/content-engine/verify.mjs

      - name: Generate today's micro-lesson brief
        working-directory: scripts/content-engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run generate

      - name: Commit and push if the brief changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/daily-brief.json content/daily-briefs/
          git diff --staged --quiet || git commit -m "chore: daily micro-lesson brief"
          git push
