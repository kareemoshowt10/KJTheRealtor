name: Morning Pulse

on:
  schedule:
    # 13:00 UTC ~= 6:00 AM Pacific (7:00 AM during PST — adjust if that gap matters).
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script dependencies
        working-directory: scripts/morning-pulse
        run: npm install

      - name: Verify content-engine logic
        run: node scripts/morning-pulse/verify.mjs

      - name: Generate today's micro-lesson brief
        working-directory: scripts/morning-pulse
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run generate

      - name: Commit and push if content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/daily-shorts/
          git diff --staged --quiet || git commit -m "chore: daily short-form content brief"
          git push
